<div class="container mt-5">
  <h2>Admin Login</h2>

  <form (ngSubmit)="login()">
    <input class="form-control mb-3"
           [(ngModel)]="email"
           name="email"
           placeholder="Email"
           required>

    <input type="password"
           class="form-control mb-3"
           [(ngModel)]="password"
           name="password"
           placeholder="Password"
           required>

    <button class="btn btn-primary">Login</button>
  </form>
</div>
